name: Publish current website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html style.css icon.svg favicon.ico apple-touch-icon.png site.webmanifest 404.html robots.txt sitemap.xml CNAME .nojekyll _site/
          mkdir -p _site/assets
          cp -R assets/. _site/assets/
          test -s _site/assets/circuit-artwork.webp
          test -s _site/assets/og-lalit-jaimini-v2.jpg
          test -s _site/index.html
          test -s _site/favicon.ico
          test -s _site/site.webmanifest
          grep -q 'Engineering depth.' _site/index.html
          grep -q 'class="logo">LJ' _site/index.html
          grep -q 'id="blueprint"' _site/index.html
          grep -q 'production-k3s-platform-blueprint' _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
